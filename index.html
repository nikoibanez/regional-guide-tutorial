<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regional Resource Directory — Tutorial</title>
  <style>
    body { max-width: 52rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    .filters { display: flex; flex-wrap: wrap; gap: 1rem; margin-block: 1rem; }
    label { display: grid; gap: .35rem; flex: 1 1 12rem; }
    input, select { font: inherit; padding: .6rem; border: 1px solid #555; border-radius: .25rem; }
    li { margin-block: .9rem; }
    a { color: #0645ad; } a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #b05c00; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Regional Resource Directory</h1>
    <p>A small demonstration using fictional sample entries and example URLs.</p>
    <div class="filters">
      <label>Search <input id="query" type="search" placeholder="Name, city, or category"></label>
      <label>State <select id="state"><option value="">All states</option><option value="NM">New Mexico</option><option value="CO">Colorado</option></select></label>
    </div>
    <p id="count" role="status" aria-live="polite">Loading records…</p>
    <ul id="results"></ul>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
